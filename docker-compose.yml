services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      FCM_SERVICE_ACCOUNT_PATH: ${FCM_SERVICE_ACCOUNT_PATH:-/opt/secure/mizan-97a67-firebase-adminsdk-fbsvc-219c32ed91.json}
    volumes:
      - ${FCM_SERVICE_ACCOUNT_HOST_PATH:-/opt/secure/mizan-97a67-firebase-adminsdk-fbsvc-219c32ed91.json}:/opt/secure/mizan-97a67-firebase-adminsdk-fbsvc-219c32ed91.json:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      FCM_SERVICE_ACCOUNT_PATH: ${FCM_SERVICE_ACCOUNT_PATH:-/opt/secure/mizan-97a67-firebase-adminsdk-fbsvc-219c32ed91.json}
    volumes:
      - ${FCM_SERVICE_ACCOUNT_HOST_PATH:-/opt/secure/mizan-97a67-firebase-adminsdk-fbsvc-219c32ed91.json}:/opt/secure/mizan-97a67-firebase-adminsdk-fbsvc-219c32ed91.json:ro
    command: celery -A app.core.celery_app.celery_app worker --loglevel=INFO --queues=default,notifications,reminders,analytics
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  beat:
    build: .
    restart: unless-stopped
    env_file: .env
    command: celery -A app.core.celery_app.celery_app beat --loglevel=INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddy_data:
