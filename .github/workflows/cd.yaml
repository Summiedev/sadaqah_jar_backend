name: CD

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      APP_NAME: "Sadaqah Jar API"
      ENV: test
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: test_secret_key_for_ci_only_32_characters_minimum
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v3

      - run: uv sync --frozen

      - run: uv run pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -Eeuo pipefail
            cd /opt/sadaqah-app/sadaqah_jar_backend
            maintenance_started=0

            on_deployment_error() {
              exit_code=$?
              if [ "$maintenance_started" -eq 1 ]; then
                echo "ERROR: the replacement failed during low-space maintenance. app, worker, and beat may need redeployment."
              fi
              exit "$exit_code"
            }
            trap on_deployment_error ERR

            free_disk_kb() {
              df -Pk / | awk 'NR == 2 { print $4 }'
            }

            minimum_disk_kb=$((2 * 1024 * 1024))

            echo "== Initial disk usage =="
            df -h /
            docker system df

            # These commands only remove resources Docker confirms are unused.
            # Volumes are intentionally excluded because they hold production data.
            echo "== Pre-release Docker cleanup =="
            docker container prune -f || echo "Warning: container cleanup failed; continuing to disk guard."
            docker image prune -af || echo "Warning: image cleanup failed; continuing to disk guard."
            docker builder prune -af || echo "Warning: builder cleanup failed; continuing to disk guard."
            docker network prune -f || echo "Warning: network cleanup failed; continuing to disk guard."

            # Validate the release before taking the application
            # containers down. A pull/config failure therefore preserves the
            # currently running release.
            git pull origin main
            docker compose config >/dev/null

            free_kb="$(free_disk_kb)"
            if [ "${free_kb:-0}" -lt "$minimum_disk_kb" ]; then
              echo "Notice: free disk remains below 2 GiB after normal cleanup."
              echo "== Low-space application recovery =="

              app_container_image=""
              worker_container_image=""
              beat_container_image=""
              app_container="$(docker compose ps -q app)"
              worker_container="$(docker compose ps -q worker)"
              beat_container="$(docker compose ps -q beat)"
              if [ -n "$app_container" ]; then
                app_container_image="$(docker inspect -f '{{.Image}}' "$app_container")"
              fi
              if [ -n "$worker_container" ]; then
                worker_container_image="$(docker inspect -f '{{.Image}}' "$worker_container")"
              fi
              if [ -n "$beat_container" ]; then
                beat_container_image="$(docker inspect -f '{{.Image}}' "$beat_container")"
              fi

              if [ -n "$app_container_image" ] \
                && [ "$app_container_image" = "$worker_container_image" ] \
                && [ "$app_container_image" = "$beat_container_image" ]; then
                echo "app, worker, and beat reference the same backend image."
                echo "That image cannot be reclaimed until all three containers stop."
              else
                echo "Application services reference different image IDs; all three will still be replaced in this emergency maintenance window."
              fi

              # Beat stops first so it cannot enqueue new periodic tasks while
              # the worker is completing its current work.
              maintenance_started=1
              docker compose stop -t 30 beat

              # Compose stop sends SIGTERM. The 60-second grace period allows
              # Celery's warm shutdown to finish active tasks. Redis is not
              # stopped, so queued messages remain in the broker.
              docker compose stop -t 60 worker
              docker compose stop -t 30 app

              # Remove only the three application containers. db, redis,
              # minio, caddy, and all Docker volumes remain untouched.
              docker compose rm -f app worker beat

              docker image prune -af || echo "Warning: image cleanup failed after application recovery."
              docker builder prune -af || echo "Warning: builder cleanup failed after application recovery."

              echo "== Disk usage after low-space recovery =="
              df -h /
              docker system df

              free_kb="$(free_disk_kb)"
              if [ "${free_kb:-0}" -lt "$minimum_disk_kb" ]; then
                echo "ERROR: Insufficient free disk space after removing old application containers and unused images. VPS disk expansion is required."
                exit 1
              fi
            fi

            # Keep PostgreSQL, Redis, MinIO, and Caddy running while the app
            # containers are rebuilt and replaced.
            docker compose up -d db redis minio caddy
            # app builds the single shared backend image used by app, worker,
            # and beat. Building the three services separately would export
            # the same large .venv layers three times on this small VPS.
            docker compose build app
            docker compose run --rm app alembic upgrade head
            docker compose up -d --remove-orphans app worker beat

            for service in app worker beat db redis minio caddy; do
              if ! docker compose ps --status running --services | grep -qx "$service"; then
                echo "ERROR: $service is not running after deployment."
                docker compose logs --tail=100 "$service"
                exit 1
              fi
            done

            app_container="$(docker compose ps -q app)"
            app_health=""
            for attempt in $(seq 1 24); do
              app_health="$(docker inspect -f '{{.State.Health.Status}}' "$app_container" 2>/dev/null || true)"
              [ "$app_health" = "healthy" ] && break
              sleep 5
            done
            if [ "$app_health" != "healthy" ]; then
              echo "ERROR: app health check did not become healthy."
              echo "== Compose status at health failure =="
              docker compose ps || true
              echo "== Docker health probe history =="
              docker inspect -f '{{range .State.Health.Log}}{{println .End "exit=" .ExitCode .Output}}{{end}}' "$app_container" || true
              echo "== Direct in-container health probe =="
              docker compose exec -T app python -c "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5); print(response.status, response.read().decode())" || true
              docker compose logs --tail=100 app
              exit 1
            fi

            # Reclaim stale release images and build cache after the new
            # containers are running. Never prune volumes here.
            echo "== Post-release Docker cleanup =="
            docker image prune -af || echo "Warning: post-deploy image cleanup failed."
            docker builder prune -af || echo "Warning: post-deploy builder cleanup failed."

            echo "== Deployment status =="
            docker compose ps
            df -h /
            docker system df
