name: API Load Test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Staging API base URL, including /api/v1"
        required: true
        type: string
      mode:
        description: "k6 profile"
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - normal
          - spike
          - stress
          - soak
      users:
        description: "Number of temporary test users"
        required: true
        default: "5"
        type: string

jobs:
  k6:
    name: k6 ${{ inputs.mode }} thresholds
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Run API load test
        env:
          BASE_URL: ${{ inputs.base_url }}
          MODE: ${{ inputs.mode }}
          USERS: ${{ inputs.users }}
        run: >-
          docker run --rm
          -e BASE_URL
          -e MODE
          -e USERS
          -v "${{ github.workspace }}:/work:ro"
          grafana/k6:latest run
          /work/load-tests/k6/mizan_load_test.js
